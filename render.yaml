# Render Blueprint - Backend API (Docker)
# Deploy: Connect GitHub repo at https://dashboard.render.com
# Add secrets (GROQ_API_KEY, GEMINI_API_KEY, etc.) in Dashboard → Environment

services:
  - type: web
    runtime: docker
    name: app-review-insights-api
    dockerfilePath: ./Dockerfile
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: EMAIL_SENDER
        sync: false
      - key: EMAIL_PASSWORD
        sync: false
      - key: EMAIL_RECIPIENT
        sync: false
      - key: CORS_ORIGINS
        sync: false  # e.g. https://app-review-insights-analyser.vercel.app
