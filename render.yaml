# Render Blueprint - Backend API (Docker)
# Backend on Render.com. Frontend on Vercel. See docs/DEPLOYMENT.md
# Add secrets in Dashboard → Environment (sync: false = secret, not from repo)

services:
  - type: web
    runtime: docker
    name: app-review-insights-analyser
    dockerfilePath: ./Dockerfile
    disk:
      name: app-data
      mountPath: /app/data
      sizeGB: 1
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: EMAIL_SENDER
        sync: false
      - key: EMAIL_RECIPIENT
        sync: false
      - key: RESEND_API_KEY
        sync: false  # Required on Render (SMTP blocked). resend.com
      - key: CORS_ORIGINS
        sync: false  # https://app-review-insights-analyser.vercel.app
      - key: REPORT_UPLOAD_SECRET
        sync: false  # Match GitHub Secrets for scheduler upload
      - key: REPORT_GIST_ID
        sync: false  # Gist ID for View Report (ephemeral disk)
      - key: GH_GIST_TOKEN
        sync: false  # PAT with gist scope
      - key: FEE_EXPLANATION_URL
        sync: false  # Phase 7: fund page URL for fee section in preview/email (e.g. https://www.indmoney.com/mutual-funds/...)
      - key: EXIT_LOAD_VALUE
        sync: false  # When fund page blocks fetch (403), use fallback (e.g. "1% if redeemed within 1 year")
