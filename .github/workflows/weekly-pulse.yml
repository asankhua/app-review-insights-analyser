# Weekly Pulse - Runs full pipeline at 9:00 AM IST every Sunday
# 9:00 AM IST = 3:30 AM UTC (IST is UTC+5:30)
name: Weekly Pulse

on:
  schedule:
    # Cron: minute hour day-of-month month day-of-week (UTC)
    # Sunday at 3:30 AM UTC = 9:00 AM IST
    - cron: '30 3 * * 0'
  workflow_dispatch:  # Allow manual trigger

jobs:
  weekly-pulse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Scope: 100 reviews, 8 weeks
      - name: Run weekly pulse and send email
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          EMAIL_SENDER: ${{ secrets.EMAIL_SENDER }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_RECIPIENT: ashishmyweb@gmail.com
        run: |
          python main.py --phase run --send --recipient ashishmyweb@gmail.com --weeks 8 --count 100
