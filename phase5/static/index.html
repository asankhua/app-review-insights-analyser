<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>App Review Insights Dashboard | Weekly Pulse</title>
  <style>
    :root,
    [data-theme="light"] {
      --bg: #f8fafc;
      --surface: #ffffff;
      --status-bg: #f1f5f9;
      --primary: #0f172a;
      --primary-muted: #475569;
      --accent: #2563eb;
      --accent-hover: #1d4ed8;
      --success: #059669;
      --success-bg: #d1fae5;
      --success-fg: #065f46;
      --error: #dc2626;
      --error-bg: #fee2e2;
      --error-fg: #991b1b;
      --info: #0284c7;
      --info-bg: #e0f2fe;
      --info-fg: #075985;
      --border: #e2e8f0;
      --shadow: 0 1px 3px rgba(0,0,0,0.06);
    }
    [data-theme="dark"] {
      --bg: #0f172a;
      --surface: #1e293b;
      --status-bg: #1e293b;
      --primary: #f1f5f9;
      --primary-muted: #94a3b8;
      --accent: #3b82f6;
      --accent-hover: #2563eb;
      --success: #10b981;
      --success-bg: #064e3b;
      --success-fg: #6ee7b7;
      --error: #ef4444;
      --error-bg: #7f1d1d;
      --error-fg: #fecaca;
      --info: #0ea5e9;
      --info-bg: #0c4a6e;
      --info-fg: #7dd3fc;
      --border: #334155;
      --shadow: 0 1px 3px rgba(0,0,0,0.3);
    }
    * { box-sizing: border-box; }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--primary);
    }

    .header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 20px 24px;
    }
    .header-inner {
      max-width: 900px;
      margin: 0 auto;
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 20px;
    }
    .header-brand { flex: 1; }
    .header h1 {
      font-size: 1.5rem;
      font-weight: 600;
      margin: 0;
      color: var(--primary);
      letter-spacing: -0.02em;
    }
    .header .subtitle {
      font-size: 0.875rem;
      color: var(--primary-muted);
      margin-top: 4px;
    }

    .main {
      max-width: 900px;
      margin: 0 auto;
      padding: 32px 24px;
    }

    .card {
      background: var(--surface);
      border-radius: 12px;
      padding: 24px;
      margin-bottom: 20px;
      box-shadow: var(--shadow);
      border: 1px solid var(--border);
    }
    .card-title {
      font-size: 0.8125rem;
      font-weight: 600;
      color: var(--primary-muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin: 0 0 16px 0;
    }

    .status-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 20px;
    }
    .status-item {
      padding: 16px;
      background: var(--status-bg);
      border-radius: 8px;
      border: 1px solid var(--border);
    }
    html { transition: background 0.2s, color 0.2s; }
    .status-item label {
      display: block;
      font-size: 0.75rem;
      color: var(--primary-muted);
      text-transform: uppercase;
      letter-spacing: 0.04em;
      margin-bottom: 4px;
    }
    .status-item .value {
      font-size: 1.25rem;
      font-weight: 600;
      color: var(--primary);
    }

    .form-group {
      margin-bottom: 16px;
    }
    .form-group label {
      display: block;
      font-size: 0.875rem;
      font-weight: 500;
      color: var(--primary);
      margin-bottom: 6px;
    }
    .form-group input[type="text"],
    .form-group input[type="email"] {
      width: 100%;
      max-width: 400px;
      padding: 10px 14px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 0.9375rem;
      transition: border-color 0.2s;
    }
    .form-group input:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
    }
    .form-group .hint {
      font-size: 0.8125rem;
      color: var(--primary-muted);
      margin-top: 6px;
    }

    .checkbox-row {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 20px;
    }
    .checkbox-row input {
      width: 18px;
      height: 18px;
      accent-color: var(--accent);
    }
    .checkbox-row label {
      font-size: 0.9375rem;
      color: var(--primary);
    }

    .actions {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      margin-top: 20px;
    }
    button {
      padding: 10px 20px;
      border: none;
      border-radius: 8px;
      font-size: 0.9375rem;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.2s, transform 0.05s;
    }
    button:active { transform: scale(0.98); }
    button:hover:not(:disabled) { opacity: 0.95; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }

    .btn-primary {
      background: var(--accent);
      color: white;
    }
    .btn-primary:hover:not(:disabled) { background: var(--accent-hover); }
    .btn-secondary {
      background: var(--primary-muted);
      color: white;
    }
    .btn-success {
      background: var(--success);
      color: white;
    }

    .message {
      padding: 14px 16px;
      border-radius: 8px;
      margin-top: 16px;
      font-size: 0.9375rem;
      line-height: 1.5;
    }
    .message.success { background: var(--success-bg); color: var(--success-fg); }
    .message.error { background: var(--error-bg); color: var(--error-fg); }
    .message.info { background: var(--info-bg); color: var(--info-fg); }

    .theme-toggle {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 14px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--surface);
      color: var(--primary-muted);
      font-size: 0.8125rem;
      cursor: pointer;
      transition: border-color 0.2s, color 0.2s;
    }
    .theme-toggle:hover {
      color: var(--primary);
      border-color: var(--accent);
    }
    .theme-toggle svg {
      width: 18px;
      height: 18px;
    }

    .report {
      white-space: pre-wrap;
      font-family: 'Georgia', 'Times New Roman', serif;
      line-height: 1.7;
      font-size: 0.9375rem;
      color: var(--primary);
    }
    .report h2 { font-size: 1.25rem; margin: 1.5rem 0 0.75rem; color: var(--primary); }
    .report h3 { font-size: 1.0625rem; margin: 1rem 0 0.5rem; color: var(--primary-muted); }
    .report p, .report ul { margin: 0.5rem 0; }
    .report hr { border: none; border-top: 1px solid var(--border); margin: 1.5rem 0; }

    .loading { opacity: 0.7; pointer-events: none; }

    .email-section {
      margin-top: 20px;
      padding-top: 20px;
      border-top: 1px solid var(--border);
    }
  </style>
</head>
<body>
  <header class="header">
    <div class="header-inner">
      <div class="header-brand">
        <h1>App Review Insights Dashboard</h1>
        <p class="subtitle">Weekly pulse from Play Store reviews — themes, quotes & action ideas for Product & Growth</p>
      </div>
      <button type="button" class="theme-toggle" id="themeToggle" title="Toggle dark/light mode">
        <span id="themeIcon"></span>
        <span id="themeLabel">Dark</span>
      </button>
    </div>
  </header>

  <main class="main">
    <div class="card">
      <h2 class="card-title">Pipeline Status</h2>
      <div class="status-grid" id="status">
        <div class="status-item">
          <label>Reviews</label>
          <span class="value" id="reviews">—</span>
        </div>
        <div class="status-item">
          <label>Themes</label>
          <span class="value" id="themes">—</span>
        </div>
        <div class="status-item">
          <label>Report</label>
          <span class="value" id="report">—</span>
        </div>
        <div class="status-item">
          <label>Last Synced</label>
          <span class="value" id="lastFetched">—</span>
        </div>
      </div>
    </div>

    <div class="card">
      <h2 class="card-title">Actions</h2>
      <div class="checkbox-row">
        <input type="checkbox" id="useMock" checked>
        <label for="useMock">Use sample data (no API keys needed)</label>
      </div>
      <div class="actions">
        <button class="btn-primary" id="btnRun" onclick="runPipeline()">Run Pipeline</button>
        <button class="btn-secondary" id="btnView" onclick="loadReport()">View Report</button>
      </div>
      <div id="actionMessage"></div>

      <div class="email-section">
        <h3 style="margin:0 0 12px 0; font-size:0.9375rem; font-weight:600;">Send Report by Email</h3>
        <div class="form-group">
          <label for="emailRecipient">Recipient email (optional)</label>
          <input type="email" id="emailRecipient" placeholder="e.g. team@company.com">
          <p class="hint">Leave blank to send to the Product & Growth team (default)</p>
        </div>
        <button class="btn-success" id="btnSend" onclick="sendEmail()">Send Email</button>
      </div>
    </div>

    <div class="card" id="reportCard" style="display:none;">
      <h2 class="card-title">Weekly Pulse</h2>
      <div class="report" id="reportContent"></div>
    </div>
  </main>

  <script>
    const API = '';

    (function initTheme() {
      const stored = localStorage.getItem('theme');
      const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
      const isDark = stored === 'dark' || (!stored && prefersDark);
      document.documentElement.setAttribute('data-theme', isDark ? 'dark' : 'light');
      updateThemeUI(isDark);
    })();
    function updateThemeUI(isDark) {
      const icon = document.getElementById('themeIcon');
      const label = document.getElementById('themeLabel');
      if (isDark) {
        icon.innerHTML = '☀️';
        label.textContent = 'Light';
      } else {
        icon.innerHTML = '🌙';
        label.textContent = 'Dark';
      }
    }
    document.getElementById('themeToggle').addEventListener('click', function() {
      const root = document.documentElement;
      const isDark = root.getAttribute('data-theme') === 'dark';
      const next = isDark ? 'light' : 'dark';
      root.setAttribute('data-theme', next);
      localStorage.setItem('theme', next);
      updateThemeUI(next === 'dark');
    });
    const reportCard = document.getElementById('reportCard');
    const reportContent = document.getElementById('reportContent');
    const actionMessage = document.getElementById('actionMessage');

    function showMessage(text, type) {
      actionMessage.className = 'message ' + type;
      actionMessage.textContent = text;
      actionMessage.style.display = 'block';
    }
    function hideMessage() {
      actionMessage.style.display = 'none';
    }
    function formatLastFetched(iso) {
      try {
        const d = new Date(iso.replace(' ', 'T'));
        if (isNaN(d.getTime())) return iso;
        return d.toLocaleString(undefined, { dateStyle: 'medium', timeStyle: 'short' });
      } catch (_) { return iso; }
    }
    function setLoading(loading) {
      document.getElementById('btnRun').disabled = loading;
      document.getElementById('btnView').disabled = loading;
      document.getElementById('btnSend').disabled = loading;
      document.body.classList.toggle('loading', loading);
    }

    let pollTimer = null;

    async function fetchStatus() {
      try {
        const r = await fetch(API + '/api/status');
        const s = await r.json();
        document.getElementById('reviews').textContent = s.reviews_count ?? '—';
        document.getElementById('themes').textContent = s.themes_count ?? '—';
        document.getElementById('report').textContent = s.has_report ? (s.last_report_date || 'Yes') : 'No';
        const last = s.last_scraped || '';
        document.getElementById('lastFetched').textContent = last ? formatLastFetched(last) : 'Never';
        if (s.pipeline_error) {
          showMessage(s.pipeline_error, 'error');
          if (pollTimer) { clearInterval(pollTimer); pollTimer = null; }
          setLoading(false);
        }
        return s;
      } catch (e) {
        document.getElementById('reviews').textContent = '?';
        document.getElementById('themes').textContent = '?';
        document.getElementById('report').textContent = 'Error';
        document.getElementById('lastFetched').textContent = '—';
        return null;
      }
    }

    async function runPipeline() {
      setLoading(true);
      hideMessage();
      if (!API) {
        showMessage('API URL not configured. Set API_URL in build.', 'error');
        setLoading(false);
        return;
      }
      try {
        const mock = document.getElementById('useMock').checked;
        const r = await fetch(API + '/api/run', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ mock: mock, weeks: 8, count: 100 })
        });
        let d;
        try { d = await r.json(); } catch (_) { throw new Error('Invalid response from server'); }
        if (!r.ok) {
          const msg = Array.isArray(d.detail) ? d.detail.map(x => x.msg || x).join('; ') : (d.detail || 'Pipeline failed');
          throw new Error(msg);
        }
        showMessage('Pipeline running... (may take 1–2 min). Checking status...', 'info');
        if (d.started) {
          pollTimer = setInterval(async () => {
            const s = await fetchStatus();
            if (s && !s.pipeline_running) {
              if (pollTimer) { clearInterval(pollTimer); pollTimer = null; }
              setLoading(false);
              showMessage('Pipeline completed. Reviews: ' + (s.reviews_count ?? '?') + ', Themes: ' + (s.themes_count ?? '?'), 'success');
            }
          }, 2500);
        } else {
          showMessage('Pipeline completed. Reviews: ' + (d.stats?.reviews_count ?? '?') + ', Themes: ' + (d.stats?.themes_count ?? '?'), 'success');
          fetchStatus();
          setLoading(false);
        }
      } catch (e) {
        const msg = e.message || 'Pipeline failed';
        let hint = '';
        if (msg === 'Failed to fetch' || msg.includes('fetch')) {
          hint = ' (Check: backend URL, CORS, or Render cold start — try again in 30s)';
        }
        showMessage(msg + hint, 'error');
        setLoading(false);
      }
    }

    async function loadReport() {
      setLoading(true);
      hideMessage();
      try {
        const r = await fetch(API + '/api/report');
        if (!r.ok) {
          showMessage('No report yet. Run the pipeline first.', 'info');
          reportCard.style.display = 'none';
          return;
        }
        const d = await r.json();
        reportContent.textContent = d.content || '';
        reportCard.style.display = 'block';
      } catch (e) {
        showMessage(e.message || 'Failed to load report', 'error');
      } finally {
        setLoading(false);
      }
    }

    async function sendEmail() {
      setLoading(true);
      hideMessage();
      const recipientInput = document.getElementById('emailRecipient');
      const recipient = recipientInput.value.trim() || null;
      try {
        const r = await fetch(API + '/api/email/send', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ recipient: recipient })
        });
        const d = await r.json();
        if (!r.ok) throw new Error(d.detail || 'Send failed');
        showMessage('Email sent to ' + (d.recipient || 'default recipient'), 'success');
      } catch (e) {
        showMessage(e.message || 'Email send failed', 'error');
      } finally {
        setLoading(false);
      }
    }

    fetchStatus();
  </script>
</body>
</html>
