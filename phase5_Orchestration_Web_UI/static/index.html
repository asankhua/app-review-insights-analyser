<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>App Review Insights Analyzer | Weekly Pulse</title>
  <style>
    :root,
    [data-theme="light"] {
      --bg: #f8fafc;
      --surface: #ffffff;
      --status-bg: #f1f5f9;
      --primary: #0f172a;
      --primary-muted: #475569;
      --accent: #2563eb;
      --accent-hover: #1d4ed8;
      --success: #059669;
      --success-bg: #d1fae5;
      --success-fg: #065f46;
      --error: #dc2626;
      --error-bg: #fee2e2;
      --error-fg: #991b1b;
      --info: #0284c7;
      --info-bg: #e0f2fe;
      --info-fg: #075985;
      --border: #e2e8f0;
      --shadow: 0 1px 3px rgba(0,0,0,0.06);
    }
    [data-theme="dark"] {
      --bg: #0f172a;
      --surface: #1e293b;
      --status-bg: #1e293b;
      --primary: #f1f5f9;
      --primary-muted: #94a3b8;
      --accent: #3b82f6;
      --accent-hover: #2563eb;
      --success: #10b981;
      --success-bg: #064e3b;
      --success-fg: #6ee7b7;
      --error: #ef4444;
      --error-bg: #7f1d1d;
      --error-fg: #fecaca;
      --info: #0ea5e9;
      --info-bg: #0c4a6e;
      --info-fg: #7dd3fc;
      --border: #334155;
      --shadow: 0 1px 3px rgba(0,0,0,0.3);
    }
    * { box-sizing: border-box; }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--primary);
    }

    .header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 20px 24px;
    }
    .header-inner {
      max-width: 900px;
      margin: 0 auto;
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 20px;
    }
    .header-brand { flex: 1; }
    .header h1 {
      font-size: 1.5rem;
      font-weight: 600;
      margin: 0;
      color: var(--primary);
      letter-spacing: -0.02em;
    }
    .header .subtitle {
      font-size: 0.875rem;
      color: var(--primary-muted);
      margin-top: 4px;
    }

    .main {
      max-width: 900px;
      margin: 0 auto;
      padding: 32px 24px;
    }

    .card {
      background: var(--surface);
      border-radius: 12px;
      padding: 24px;
      margin-bottom: 20px;
      box-shadow: var(--shadow);
      border: 1px solid var(--border);
    }
    .card-title {
      font-size: 0.8125rem;
      font-weight: 600;
      color: var(--primary-muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin: 0 0 16px 0;
    }

    .status-grid {
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 16px;
    }
    .status-item {
      padding: 16px;
      background: var(--status-bg);
      border-radius: 8px;
      border: 1px solid var(--border);
    }
    html { transition: background 0.2s, color 0.2s; }
    .status-item label {
      display: block;
      font-size: 0.75rem;
      color: var(--primary-muted);
      text-transform: uppercase;
      letter-spacing: 0.04em;
      margin-bottom: 4px;
    }
    .status-item .value {
      font-size: 1.125rem;
      font-weight: 600;
      color: var(--primary);
      word-break: break-word;
      overflow-wrap: break-word;
      line-height: 1.4;
    }
    .status-item .value.value-count {
      font-size: 1.75rem;
      line-height: 1.2;
    }

    .form-group {
      margin-bottom: 16px;
    }
    .form-group label {
      display: block;
      font-size: 0.875rem;
      font-weight: 500;
      color: var(--primary);
      margin-bottom: 6px;
    }
    .form-group input[type="text"],
    .form-group input[type="email"] {
      width: 100%;
      max-width: 400px;
      padding: 10px 14px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 0.9375rem;
      transition: border-color 0.2s;
    }
    .form-group input:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
    }
    .form-group .hint {
      font-size: 0.8125rem;
      color: var(--primary-muted);
      margin-top: 6px;
    }

    .checkbox-row {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 20px;
    }
    .checkbox-row input {
      width: 18px;
      height: 18px;
      accent-color: var(--accent);
    }
    .checkbox-row label {
      font-size: 0.9375rem;
      color: var(--primary);
    }

    .actions {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      margin-top: 20px;
    }
    button {
      padding: 10px 20px;
      border: none;
      border-radius: 8px;
      font-size: 0.9375rem;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.2s, transform 0.05s;
    }
    button:active { transform: scale(0.98); }
    button:hover:not(:disabled) { opacity: 0.95; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }

    .btn-primary {
      background: var(--accent);
      color: white;
    }
    .btn-primary:hover:not(:disabled) { background: var(--accent-hover); }
    .btn-secondary {
      background: var(--primary-muted);
      color: white;
    }
    .btn-success {
      background: var(--success);
      color: white;
    }

    .message {
      padding: 14px 16px;
      border-radius: 8px;
      margin-top: 16px;
      font-size: 0.9375rem;
      line-height: 1.5;
    }
    .message.success { background: var(--success-bg); color: var(--success-fg); }
    .message.error { background: var(--error-bg); color: var(--error-fg); }
    .message.info { background: var(--info-bg); color: var(--info-fg); }

    .theme-toggle {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 14px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--surface);
      color: var(--primary-muted);
      font-size: 0.8125rem;
      cursor: pointer;
      transition: border-color 0.2s, color 0.2s;
    }
    .theme-toggle:hover {
      color: var(--primary);
      border-color: var(--accent);
    }
    .theme-toggle svg {
      width: 18px;
      height: 18px;
    }

    .report {
      white-space: pre-wrap;
      font-family: 'Georgia', 'Times New Roman', serif;
      line-height: 1.7;
      font-size: 0.9375rem;
      color: var(--primary);
    }
    .report h2 { font-size: 1.25rem; margin: 1.5rem 0 0.75rem; color: var(--primary); }
    .report h3 { font-size: 1.0625rem; margin: 1rem 0 0.5rem; color: var(--primary-muted); }
    .report p, .report ul { margin: 0.5rem 0; }
    .report hr { border: none; border-top: 1px solid var(--border); margin: 1.5rem 0; }

    .loading { opacity: 0.7; pointer-events: none; }
    #page-load-fallback { display: block; }

    .email-section {
      margin-top: 20px;
      padding-top: 20px;
      border-top: 1px solid var(--border);
    }
    .preview-modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.6);
      z-index: 1000;
      align-items: center;
      justify-content: center;
      padding: 20px;
      box-sizing: border-box;
    }
    .preview-modal-inner {
      background: var(--surface);
      border-radius: 12px;
      max-width: 640px;
      width: 100%;
      max-height: 90vh;
      display: flex;
      flex-direction: column;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
      border: 1px solid var(--border);
    }
    .preview-modal-header {
      padding: 16px 20px;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-shrink: 0;
    }
    .preview-modal-header h3 {
      margin: 0;
      font-size: 1rem;
      color: var(--primary);
    }
    .preview-modal-body {
      flex: 1;
      min-height: 0;
      overflow: hidden;
    }
    .preview-modal-body iframe {
      width: 100%;
      height: 70vh;
      border: none;
      display: block;
      background: #fff;
    }
  </style>
</head>
<body>
  <p id="page-load-fallback" style="padding:16px 24px;margin:0;font-size:0.9375rem;color:#475569;">Loading…</p>
  <header class="header">
    <div class="header-inner">
      <div class="header-brand">
        <h1>App Review Insights Analyzer</h1>
        <p class="subtitle">Weekly pulse from Play Store reviews — themes, quotes & action ideas for Product & Growth</p>
      </div>
      <button type="button" class="theme-toggle" id="themeToggle" title="Toggle dark/light mode">
        <span id="themeIcon"></span>
        <span id="themeLabel">Dark</span>
      </button>
    </div>
  </header>

  <main class="main">
    <div class="card">
      <h2 class="card-title">Pipeline Status</h2>
      <div class="status-grid" id="status">
        <div class="status-item">
          <label>Reviews</label>
          <span class="value value-count" id="reviews">—</span>
        </div>
        <div class="status-item">
          <label>Themes</label>
          <span class="value value-count" id="themes">—</span>
        </div>
        <div class="status-item">
          <label>Scheduler Run</label>
          <span class="value" id="lastRun">—</span>
        </div>
        <div class="status-item">
          <label>Last Email Sent</label>
          <span class="value" id="lastEmailSent">—</span>
        </div>
        <div class="status-item" id="mcpStatusRow" style="display:none;">
          <label>Google Doc (MCP)</label>
          <span class="value" id="mcpStatusMessage"></span>
        </div>
      </div>
    </div>

    <div class="card">
      <h2 class="card-title">Actions</h2>
      <div class="checkbox-row">
        <input type="checkbox" id="useSample">
        <label for="useSample">Use sample data</label>
      </div>
      <div class="actions">
        <button class="btn-secondary" id="btnView" onclick="loadReport()">View Report</button>
      </div>
      <div id="actionMessage"></div>

      <div class="email-section">
        <h3 style="margin:0 0 12px 0; font-size:0.9375rem; font-weight:600;">Send Report by Email</h3>
        <p class="hint" style="margin:0 0 12px 0;">Sends to: Product Growth Team</p>
        <div class="actions">
          <button class="btn-secondary" id="btnPreview" onclick="previewEmail()">Preview Email</button>
          <button class="btn-success" id="btnSend" onclick="sendEmail()">Send Email</button>
        </div>
      </div>
    </div>

    <div class="card" id="reportCard" style="display:none;">
      <h2 class="card-title">Weekly Pulse</h2>
      <div class="report" id="reportContent"></div>
    </div>
  </main>

  <div class="preview-modal" id="previewModal" onclick="if(event.target===this)closePreviewModal()">
    <div class="preview-modal-inner">
      <div class="preview-modal-header">
        <h3 id="previewSubject">Email Preview</h3>
        <button type="button" class="btn-secondary" onclick="closePreviewModal()">Close</button>
      </div>
      <div class="preview-modal-body">
        <iframe id="previewFrame" title="Email preview"></iframe>
      </div>
    </div>
  </div>

  <script>
    // Use same origin so API calls work when served from this server (e.g. http://localhost:8000)
    const API = (typeof window !== 'undefined' && window.location && window.location.origin) ? window.location.origin : '';

    (function initTheme() {
      const stored = localStorage.getItem('theme');
      const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
      const isDark = stored === 'dark' || (!stored && prefersDark);
      document.documentElement.setAttribute('data-theme', isDark ? 'dark' : 'light');
      updateThemeUI(isDark);
    })();
    function updateThemeUI(isDark) {
      const icon = document.getElementById('themeIcon');
      const label = document.getElementById('themeLabel');
      if (isDark) {
        icon.innerHTML = '☀️';
        label.textContent = 'Light';
      } else {
        icon.innerHTML = '🌙';
        label.textContent = 'Dark';
      }
    }
    document.getElementById('themeToggle').addEventListener('click', function() {
      const root = document.documentElement;
      const isDark = root.getAttribute('data-theme') === 'dark';
      const next = isDark ? 'light' : 'dark';
      root.setAttribute('data-theme', next);
      localStorage.setItem('theme', next);
      updateThemeUI(next === 'dark');
    });
    const reportCard = document.getElementById('reportCard');
    const reportContent = document.getElementById('reportContent');
    const actionMessage = document.getElementById('actionMessage');

    function showMessage(text, type) {
      actionMessage.className = 'message ' + type;
      actionMessage.textContent = text;
      actionMessage.style.display = 'block';
    }
    function hideMessage() {
      actionMessage.style.display = 'none';
    }
    const IST_OPTS = { timeZone: 'Asia/Kolkata', dateStyle: 'short', timeStyle: 'short' };
    function formatIST(iso) {
      try {
        let s = (iso || '').toString().replace(' ', 'T').trim();
        if (!s) return '—';
        // Treat naive timestamps (no Z or offset) as UTC for consistent IST display
        if (!/Z|[+-]\d{2}:?\d{2}$/.test(s)) s = s.replace(/(\.\d+)?$/, '$1Z');
        const d = new Date(s);
        if (isNaN(d.getTime())) return iso;
        return d.toLocaleString(undefined, IST_OPTS);
      } catch (_) { return iso || '—'; }
    }
    function setLoading(loading) {
      var btnView = document.getElementById('btnView');
      var btnPreview = document.getElementById('btnPreview');
      var btnSend = document.getElementById('btnSend');
      if (btnView) btnView.disabled = loading;
      if (btnPreview) btnPreview.disabled = loading;
      if (btnSend) btnSend.disabled = loading;
      document.body.classList.toggle('loading', loading);
    }

    function hideLoadFallback() {
      var el = document.getElementById('page-load-fallback');
      if (el) el.style.display = 'none';
    }
    function parseISODate(iso) {
      if (!iso) return null;
      var s = (iso + '').trim().replace(' ', 'T');
      if (!/Z|[+-]\d{2}:?\d{2}$/.test(s)) s = s.replace(/(\.\d+)?$/, '$1Z');
      var d = new Date(s);
      return isNaN(d.getTime()) ? null : d;
    }
    function latestRunStamp(s) {
      var a = parseISODate(s.scheduler_run);
      var b = parseISODate(s.last_run);
      if (!a && !b) return null;
      if (!a) return s.last_run;
      if (!b) return s.scheduler_run;
      return a >= b ? s.scheduler_run : s.last_run;
    }
    function updateStatusPanel(s) {
      if (!s) return;
      hideLoadFallback();
      document.getElementById('reviews').textContent = s.reviews_count ?? '—';
      document.getElementById('themes').textContent = s.themes_count ?? '—';
      var lastRunEl = document.getElementById('lastRun');
      var latestRun = latestRunStamp(s);
      lastRunEl.textContent = latestRun ? formatIST(latestRun) : 'Never';
      lastRunEl.title = s.gist_unavailable ? 'Gist configured but unreachable. Check GH_GIST_TOKEN and REPORT_GIST_ID.' : '';
      document.getElementById('lastEmailSent').textContent = s.last_email_sent ? formatIST(s.last_email_sent) : 'Never';
      var mcpRow = document.getElementById('mcpStatusRow');
      var mcpMsg = document.getElementById('mcpStatusMessage');
      if (s.mcp_append_message) {
        mcpRow.style.display = '';
        var prefix = s.mcp_append_success ? '\u2713 Success: ' : '\u2717 Failed: ';
        mcpMsg.textContent = prefix + s.mcp_append_message;
        mcpMsg.style.color = s.mcp_append_success ? 'var(--success, #0a0)' : 'var(--error, #c00)';
      } else {
        mcpRow.style.display = 'none';
      }
    }
    async function fetchStatus() {
      try {
        const r = await fetch(API + '/api/status');
        if (!r.ok) {
          var errBody = {};
          try { errBody = await r.json(); } catch (_) {}
          if (r.status === 503 && errBody.pipeline_error) {
            document.getElementById('actionMessage').className = 'message info';
            document.getElementById('actionMessage').textContent = errBody.pipeline_error;
            document.getElementById('actionMessage').style.display = 'block';
          }
          throw new Error(r.status === 503 ? (errBody.pipeline_error || 'Status timed out') : 'Status ' + r.status);
        }
        const s = await r.json();
        updateStatusPanel(s);
        if (s.pipeline_error) {
          const err = String(s.pipeline_error);
          if (err && err !== '1') showMessage(err, 'error');
          setLoading(false);
        }
        if (s.status_loading) {
          setTimeout(fetchStatus, 2000);
        }
        return s;
      } catch (e) {
        hideLoadFallback();
        document.getElementById('reviews').textContent = '?';
        document.getElementById('themes').textContent = '?';
        document.getElementById('lastRun').textContent = '—';
        document.getElementById('lastEmailSent').textContent = '—';
        document.getElementById('mcpStatusRow').style.display = 'none';
        return null;
      }
    }

    async function loadReport() {
      setLoading(true);
      hideMessage();
      try {
        var useSample = document.getElementById('useSample').checked;
        var reportRes, statusRes;
        try {
          var fetchOpts = (typeof AbortSignal !== 'undefined' && AbortSignal.timeout)
            ? { signal: AbortSignal.timeout(60000) } : {};
          [reportRes, statusRes] = await Promise.all([
            fetch(API + '/api/report' + (useSample ? '?sample=1' : ''), fetchOpts),
            fetch(API + '/api/status', fetchOpts),
          ]);
        } catch (fetchErr) {
          var hint = '';
          if (/failed to fetch|load failed|networkerror/i.test(fetchErr.message || '')) {
            hint = ' Backend may be starting (Render free tier). Wait 30s and try again. Check CORS_ORIGINS includes your Vercel URL.';
          }
          showMessage((fetchErr.message || 'Failed to load report') + hint, 'error');
          return;
        }
        if (statusRes.ok) {
          var statusData = await statusRes.json();
          updateStatusPanel(statusData);
        }
        var ct = reportRes.headers.get('content-type') || '';
        if (!reportRes.ok) {
          var msg = 'No report found.';
          if (ct.includes('json')) {
            try {
              var err = await reportRes.json();
              msg = (typeof err.detail === 'string' ? err.detail : err.detail?.msg) || msg;
            } catch (_) {}
          }
          showMessage(msg, 'info');
          reportCard.style.display = 'none';
          return;
        }
        if (!ct.includes('json')) {
          showMessage('Backend returned non-JSON. It may be starting up. Wait 30s and try again.', 'error');
          return;
        }
        var d = await reportRes.json();
        reportContent.textContent = d.content || '';
        reportCard.style.display = 'block';
      } catch (e) {
        showMessage(e.message || 'Failed to load report', 'error');
      } finally {
        setLoading(false);
      }
    }

    function closePreviewModal() {
      document.getElementById('previewModal').style.display = 'none';
    }
    async function previewEmail() {
      setLoading(true);
      hideMessage();
      try {
        const useSample = document.getElementById('useSample').checked;
        const r = await fetch(API + '/api/email/preview' + (useSample ? '?sample=1' : ''));
        if (!r.ok) {
          const err = await r.json().catch(() => ({}));
          const msg = (typeof err.detail === 'string' ? err.detail : null) || 'No report yet. Run the pipeline first.';
          showMessage(msg, 'info');
          setLoading(false);
          return;
        }
        const d = await r.json();
        const iframe = document.getElementById('previewFrame');
        iframe.srcdoc = d.html;
        document.getElementById('previewSubject').textContent = d.subject || 'Email Preview';
        document.getElementById('previewModal').style.display = 'flex';
      } catch (e) {
        showMessage(e.message || 'Failed to load preview', 'error');
      } finally {
        setLoading(false);
      }
    }
    async function sendEmail() {
      setLoading(true);
      hideMessage();
      try {
        const r = await fetch(API + '/api/email/send', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ recipient: null })
        });
        let d;
        try { d = await r.json(); } catch (_) { d = {}; }
        if (r.status === 202) {
          showMessage('Sending email…', 'info');
          const poll = async () => {
            try {
              const sr = await fetch(API + '/api/email/send-status');
              const s = await sr.json();
              if (s.pending) {
                setTimeout(poll, 2000);
                return;
              }
              setLoading(false);
              if (s.success) {
                showMessage('Email sent successfully to Product Growth Team', 'success');
                fetchStatus();
              } else {
                showMessage(s.error || 'Email send failed', 'error');
              }
            } catch (e) {
              setLoading(false);
              showMessage(e.message || 'Could not get send status', 'error');
            }
          };
          setTimeout(poll, 1500);
          return;
        }
        if (!r.ok) throw new Error(typeof d.detail === 'string' ? d.detail : (d.detail?.message || 'Send failed'));
        showMessage('Email sent successfully to Product Growth Team', 'success');
        fetchStatus();
      } catch (e) {
        showMessage(e.message || 'Email send failed', 'error');
      } finally {
        setLoading(false);
      }
    }

    try {
      fetchStatus();
    } catch (e) {
      hideLoadFallback();
      var el = document.getElementById('page-load-fallback');
      if (el) { el.textContent = 'Error: ' + (e && e.message ? e.message : 'Could not load app'); el.style.color = '#dc2626'; }
    }
  </script>
</body>
</html>
